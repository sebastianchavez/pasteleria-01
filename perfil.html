<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Playfair Display', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
<meta name="currency" content="CLP">
</head>
<body class="min-h-screen flex flex-col">
  <div data-header></div>

  <main class="flex-1 py-8">
    <div class="container-page" id="perfil-contenido"></div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    const sesion = obtenerSesion();
    if (!sesion) {
      window.location.href = 'login.html?redirect=perfil.html';
    } else {
      const usuarios = obtenerUsuarios();
      const usuario = usuarios.find(u => u.email === sesion.email);
      const pedidos = obtenerPedidos().filter(p => p.usuarioEmail === sesion.email).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
      const iniciales = sesion.nombre.split(' ').map(n => n[0]).join('').toUpperCase();

      const estadosBadge = {
        'Procesando': 'bg-yellow-100 text-yellow-700',
        'En camino': 'bg-blue-100 text-blue-700',
        'Entregado': 'bg-green-100 text-green-700',
        'Cancelado': 'bg-red-100 text-red-700'
      };

      const totalGastado = pedidos.reduce((acc, p) => acc + p.total, 0);

      document.getElementById('perfil-contenido').innerHTML = `
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
          <div>
            <h1 class="font-display text-3xl md:text-4xl font-bold text-gray-800">Mi Perfil</h1>
            <p class="text-gray-500">Gestiona tu cuenta y revisa tus pedidos</p>
          </div>
          <button onclick="cerrarSesionYRedirigir()" class="btn-secondary">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Cerrar sesión
          </button>
        </div>

        <div class="grid lg:grid-cols-3 gap-8">
          <div class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6 text-center">
              <div class="w-24 h-24 mx-auto bg-gradient-to-br from-pink-300 to-pink-500 rounded-full flex items-center justify-center mb-4 ring-4 ring-pink-100">
                <span class="text-3xl font-display font-bold text-white">${iniciales}</span>
              </div>
              <h2 class="font-display text-xl font-bold text-gray-800">${sesion.nombre}</h2>
              <p class="text-sm text-gray-500">${sesion.email}</p>
              ${usuario && usuario.fechaRegistro ? `<p class="text-xs text-gray-400 mt-2">Miembro desde ${formatearFecha(usuario.fechaRegistro)}</p>` : ''}
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6">
              <h3 class="font-display text-lg font-bold text-gray-800 mb-4">Datos personales</h3>
              <form id="perfil-form" class="space-y-3">
                <div>
                  <label class="block text-xs text-gray-500 mb-1">Nombre</label>
                  <input type="text" name="nombre" value="${usuario ? usuario.nombre : sesion.nombre}" class="input-field text-sm py-2">
                </div>
                <div>
                  <label class="block text-xs text-gray-500 mb-1">Teléfono</label>
                  <input type="tel" name="telefono" value="${usuario ? usuario.telefono || '' : ''}" class="input-field text-sm py-2" placeholder="+56 9 1234 5678">
                </div>
                <div>
                  <label class="block text-xs text-gray-500 mb-1">Dirección</label>
                  <input type="text" name="direccion" value="${usuario ? usuario.direccion || '' : ''}" class="input-field text-sm py-2" placeholder="Tu dirección">
                </div>
                <button type="submit" class="btn-primary w-full py-2 text-sm">Guardar cambios</button>
              </form>
            </div>

            <div class="bg-gradient-to-br from-pink-100 to-pink-50 rounded-2xl p-6">
              <h3 class="font-display text-lg font-bold text-gray-800 mb-4">Resumen</h3>
              <div class="space-y-3">
                <div class="flex justify-between items-center">
                  <span class="text-gray-600 text-sm">Pedidos totales</span>
                  <span class="font-display font-bold text-pink-500 text-xl">${pedidos.length}</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-gray-600 text-sm">Total gastado</span>
                  <span class="font-display font-bold text-pink-500 text-xl">${formatearPrecio(totalGastado)}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="lg:col-span-2">
            <div class="bg-white rounded-2xl shadow-sm border border-pink-100">
              <div class="p-6 border-b border-pink-100">
                <h2 class="font-display text-2xl font-bold text-gray-800">Historial de pedidos</h2>
              </div>
              ${pedidos.length === 0 ? `
                <div class="text-center py-16 px-6">
                  <div class="text-6xl mb-4">📦</div>
                  <h3 class="font-display text-xl font-bold text-gray-800 mb-2">No tienes pedidos aún</h3>
                  <p class="text-gray-500 mb-6">¡Explora nuestros productos y realiza tu primera compra!</p>
                  <a href="productos.html" class="btn-primary">Ver Productos</a>
                </div>
              ` : `
                <div class="divide-y divide-pink-50">
                  ${pedidos.map(p => `
                    <div class="p-6 hover:bg-pink-50 transition">
                      <div class="flex flex-wrap items-start justify-between gap-4 mb-3">
                        <div>
                          <p class="font-display font-bold text-gray-800">${p.id}</p>
                          <p class="text-sm text-gray-500">${formatearFecha(p.fecha)}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${estadosBadge[p.estado] || 'bg-gray-100 text-gray-700'}">${p.estado}</span>
                      </div>
                      <div class="flex items-center gap-2 mb-3">
                        ${p.productos.slice(0, 4).map(prod => `
                          <img src="${prod.imagen}" alt="${prod.nombre}" class="w-12 h-12 rounded-lg object-cover border-2 border-pink-100">
                        `).join('')}
                        ${p.productos.length > 4 ? `<div class="w-12 h-12 rounded-lg bg-pink-100 flex items-center justify-center text-pink-500 text-xs font-bold">+${p.productos.length - 4}</div>` : ''}
                      </div>
                      <div class="flex items-center justify-between">
                        <div>
                          <p class="text-sm text-gray-500">${p.productos.length} producto${p.productos.length !== 1 ? 's' : ''}</p>
                          <p class="font-display text-lg font-bold text-pink-500">${formatearPrecio(p.total)}</p>
                        </div>
                        <a href="pedido.html?id=${p.id}" class="btn-ghost text-sm">Ver detalle →</a>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;

      document.getElementById('perfil-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const idx = usuarios.findIndex(u => u.email === sesion.email);
        if (idx >= 0) {
          usuarios[idx].nombre = formData.get('nombre');
          usuarios[idx].telefono = formData.get('telefono');
          usuarios[idx].direccion = formData.get('direccion');
          guardarUsuarios(usuarios);
          guardarSesion({ ...sesion, nombre: formData.get('nombre') });
          toast('Datos actualizados correctamente', 'success');
          setTimeout(() => window.location.reload(), 800);
        }
      });
    }
  </script>
</body>
</html>
