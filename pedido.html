<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Pedido - Dulce Tentación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Playfair Display', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">
  <div data-header></div>

  <main class="flex-1 py-8">
    <div class="container-page max-w-4xl" id="pedido-contenido"></div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    const sesion = obtenerSesion();
    if (!sesion) {
      window.location.href = 'login.html?redirect=perfil.html';
    } else {
      const pedidoId = obtenerQueryParam('id');
      const pedido = obtenerPedidos().find(p => p.id === pedidoId);

      if (!pedido || pedido.usuarioEmail !== sesion.email) {
        document.getElementById('pedido-contenido').innerHTML = `
          <div class="text-center py-16">
            <div class="text-6xl mb-4">😢</div>
            <h2 class="font-display text-2xl font-bold text-gray-800 mb-2">Pedido no encontrado</h2>
            <p class="text-gray-500 mb-6">No pudimos encontrar el pedido solicitado.</p>
            <a href="perfil.html" class="btn-primary">Volver a mi perfil</a>
          </div>
        `;
      } else {
        document.title = `Pedido ${pedido.id} - Dulce Tentación`;

        const estadosInfo = {
          'Procesando': { color: 'yellow', icon: '⏳', mensaje: 'Estamos preparando tu pedido' },
          'En camino': { color: 'blue', icon: '🚚', mensaje: 'Tu pedido va en camino' },
          'Entregado': { color: 'green', icon: '✓', mensaje: 'Pedido entregado con éxito' },
          'Cancelado': { color: 'red', icon: '✕', mensaje: 'Pedido cancelado' }
        };
        const estadoInfo = estadosInfo[pedido.estado] || estadosInfo['Procesando'];
        const estadoColorClass = {
          yellow: 'bg-yellow-100 text-yellow-700',
          blue: 'bg-blue-100 text-blue-700',
          green: 'bg-green-100 text-green-700',
          red: 'bg-red-100 text-red-700'
        };

        document.getElementById('pedido-contenido').innerHTML = `
          <div class="mb-6">
            <a href="perfil.html" class="btn-ghost mb-4">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
              Volver a mi perfil
            </a>
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div>
                <h1 class="font-display text-3xl md:text-4xl font-bold text-gray-800 mb-1">Pedido ${pedido.id}</h1>
                <p class="text-gray-500">Realizado el ${formatearFecha(pedido.fecha)}</p>
              </div>
              <span class="px-4 py-2 rounded-full text-sm font-semibold ${estadoColorClass[estadoInfo.color]}">${estadoInfo.icon} ${pedido.estado}</span>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6 mb-6">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center text-2xl">${estadoInfo.icon}</div>
              <div>
                <p class="font-display text-lg font-bold text-gray-800">${estadoInfo.mensaje}</p>
                <p class="text-sm text-gray-500">${pedido.tipoEnvio}</p>
              </div>
            </div>
            <div class="mt-6 flex items-center justify-between">
              <div class="flex-1 flex items-center">
                <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center text-sm">✓</div>
                <div class="flex-1 h-1 bg-green-500 mx-1"></div>
                <div class="w-8 h-8 rounded-full ${pedido.estado !== 'Procesando' ? 'bg-green-500 text-white' : 'bg-pink-200 text-pink-500'} flex items-center justify-center text-sm">${pedido.estado !== 'Procesando' ? '✓' : '2'}</div>
                <div class="flex-1 h-1 ${pedido.estado === 'Entregado' ? 'bg-green-500' : 'bg-pink-200'} mx-1"></div>
                <div class="w-8 h-8 rounded-full ${pedido.estado === 'Entregado' ? 'bg-green-500 text-white' : 'bg-pink-200 text-pink-500'} flex items-center justify-center text-sm">${pedido.estado === 'Entregado' ? '✓' : '3'}</div>
              </div>
            </div>
            <div class="mt-2 flex justify-between text-xs text-gray-500 px-2">
              <span>Confirmado</span>
              <span>En camino</span>
              <span>Entregado</span>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6">
              <h3 class="font-display text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
                <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Dirección de envío
              </h3>
              <div class="text-sm text-gray-600 space-y-1">
                <p class="font-semibold text-gray-800">${pedido.direccion.nombre}</p>
                <p>${pedido.direccion.telefono}</p>
                <p>${pedido.direccion.calle}</p>
                <p>${pedido.direccion.ciudad}, CP ${pedido.direccion.codigoPostal}</p>
                ${pedido.direccion.referencia ? `<p class="text-xs text-gray-500 mt-2 italic">Ref: ${pedido.direccion.referencia}</p>` : ''}
              </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6">
              <h3 class="font-display text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
                <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                Pago
              </h3>
              <div class="text-sm text-gray-600 space-y-1">
                <p class="font-semibold text-gray-800">${pedido.metodoPago}</p>
                <p>Total: <span class="font-display font-bold text-pink-500 text-base">${formatearPrecio(pedido.total)}</span></p>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden mb-6">
            <div class="p-6 border-b border-pink-100">
              <h3 class="font-display text-lg font-bold text-gray-800">Productos del pedido</h3>
            </div>
            <div class="divide-y divide-pink-50">
              ${pedido.productos.map(p => `
                <div class="p-6 flex items-center gap-4">
                  <img src="${p.imagen}" alt="${p.nombre}" class="w-20 h-20 rounded-xl object-cover">
                  <div class="flex-1 min-w-0">
                    <a href="producto.html?id=${p.id}" class="font-display font-bold text-gray-800 hover:text-pink-500 line-clamp-1">${p.nombre}</a>
                    <p class="text-sm text-gray-500">${formatearPrecio(p.precio)} × ${p.cantidad}</p>
                  </div>
                  <div class="text-right">
                    <p class="font-display font-bold text-pink-500">${formatearPrecio(p.precio * p.cantidad)}</p>
                    <a href="resena.html?producto=${p.id}&pedido=${pedido.id}" class="text-xs text-pink-500 hover:underline">Dejar reseña</a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-pink-100 p-6">
            <div class="space-y-2 mb-4">
              <div class="flex justify-between text-gray-600">
                <span>Subtotal</span>
                <span class="font-semibold text-gray-800">${formatearPrecio(pedido.subtotal)}</span>
              </div>
              <div class="flex justify-between text-gray-600">
                <span>Envío (${pedido.tipoEnvio})</span>
                <span class="font-semibold text-gray-800">${formatearPrecio(pedido.envio)}</span>
              </div>
            </div>
            <div class="flex justify-between items-center pt-4 border-t border-pink-100">
              <span class="font-display text-lg font-bold text-gray-800">Total</span>
              <span class="font-display text-2xl font-bold text-pink-500">${formatearPrecio(pedido.total)}</span>
            </div>
          </div>

          <div class="mt-6 flex flex-wrap gap-3 justify-end">
            <button onclick="window.print()" class="btn-secondary no-print">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
              Imprimir
            </button>
            <a href="productos.html" class="btn-primary no-print">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              Seguir comprando
            </a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
